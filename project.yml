name: BigTodo
options:
  bundleIdPrefix: com.bigtodo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BigTodo:
    type: application
    platform: iOS
    sources:
      - BigTodo
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigtodo.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: BigTodo/Info.plist
      properties:
        CFBundleDisplayName: Todo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: BigTodo/BigTodo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bigtodo.shared
    dependencies:
      - target: TodoWidgetExtension

  TodoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - TodoWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigtodo.app.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TodoWidget/Info.plist
      properties:
        CFBundleDisplayName: Todo 위젯
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TodoWidget/TodoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bigtodo.shared
